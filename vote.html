<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VoteHi - Voter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href='https://bowser245.github.io/votehi'><button><- Retour à l'accueil</button></a>
        <div id="vote-content">Chargement du vote...</div>
        
        <div id="comments-section" style="margin-top: 40px; display: none;">
            <div><button onclick="copierdlpp(this)" class="btn">🔗 Partager</button></div>
            <h2>💬 Espace de discussion</h2>
            <div class="card">
                <input type="text" id="comment-author" placeholder="Ton pseudo (ex: Anonyme_123)" required>
                <textarea id="comment-content" placeholder="Écris ton commentaire ici..." required></textarea>
                <button type="button" onclick="postComment()" class="btn">Publier le commentaire</button>
            </div>
            <div id="comments-list">Chargement des commentaires...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://bsfdtdyoeaunssuqtgmj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gXblbgXH3n1ihrYa_OpB2A_r7nNSpCZ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const voteId = urlParams.get('id');
        function copierdlpp(btn) {
            const urlParams = new URLSearchParams(window.location.search);
            const voteId = urlParams.get('id');

            if (!voteId) {
                alert("Identifiant de vote introuvable.");
                return;
            }

            const lienVote = `Vien voter sur VoteHi https://bowser245.github.io/votehi/vote.html?id=${voteId}`;

            navigator.clipboard.writeText(lienVote).then(() => {
                const texteOriginal = btn.innerText;
        
                // Modifie le texte grâce au "caller" (btn)
                btn.innerText = "✅ Lien copié !";
        
                // Remet le texte d'origine après 2 secondes
                setTimeout(() => {
                    btn.innerText = texteOriginal;
                }, 2000);
            }).catch(err => {
                console.error("Erreur lors de la copie : ", err);
            });
        }
        async function loadVotePage() {
            const container = document.getElementById('vote-content');

            if (!voteId) {
                container.innerHTML = "<h2>Erreur : Aucun identifiant de vote spécifié.</h2>";
                return;
            }

            // Récupérer le vote
            const { data, error } = await supabaseClient
                .from('votes')
                .select('*')
                .eq('id', voteId)
                .single();

            if (error || !data) {
                container.innerHTML = "<h2>Impossible de trouver ce vote.</h2>";
                return;
            }

            // Incrémenter le compteur de vues (via un stockage session pour éviter de spammer les vues à chaque rechargement)
            if (!sessionStorage.getItem(`viewed_${voteId}`)) {
                sessionStorage.setItem(`viewed_${voteId}`, "true");
                await supabaseClient
                    .from('votes')
                    .update({ views: (data.views || 0) + 1 })
                    .eq('id', voteId);
                data.views = (data.views || 0) + 1;
            }

            const hasVoted = localStorage.getItem(`voted_${voteId}`);

            let html = '';
            if (data.banner) {
                html += `<img src="${data.banner}" class="banner" alt="Bannière">`;
            }
            html += `<h1>${data.title}</h1>`;
            html += `<p>${data.description || ''}</p>`;
            html += `<p class="text-muted">👁️ ${data.views || 0} vues</p>`;
            html += `<h3>Options :</h3>`;

            data.options.forEach((opt, index) => {
                html += `
                    <div class="option-card">
                        <div class="left">
                            ${opt.image ? `<img src="${opt.image}" class="option-img">` : ''}
                            <div>
                                <strong>${opt.name}</strong><br>
                                <small>${opt.description || ''}</small><br>
                                <span><strong>${opt.votes || 0}</strong> votes</span>
                            </div>
                        </div>
                `;

                if (!hasVoted) {
                    html += `<button onclick="castVote(${index})" class="btn btn-success">Voter</button>`;
                } else {
                    html += `<span class="text-muted" style="font-style: italic;">Déjà voté</span>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
            window.currentVoteData = data;

            // Afficher la section commentaires et les charger
            document.getElementById('comments-section').style.display = 'block';
            loadComments();
        }

        async function castVote(optionIndex) {
            let data = window.currentVoteData;
            data.options[optionIndex].votes = (data.options[optionIndex].votes || 0) + 1;

            const { error } = await supabaseClient
                .from('votes')
                .update({ options: data.options })
                .eq('id', voteId);

            if (error) {
                alert("Erreur lors de l'enregistrement du vote : " + error.message);
            } else {
                localStorage.setItem(`voted_${voteId}`, "true");
                alert("Votre vote a bien été pris en compte !");
                location.reload();
            }
        }

        async function loadComments() {
            const listContainer = document.getElementById('comments-list');
            const { data, error } = await supabaseClient
                .from('comments')
                .select('*')
                .eq('vote_id', voteId)
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = '<p class="text-muted">Aucun commentaire pour le moment. Soyez le premier à réagir !</p>';
                return;
            }

            let html = '';
            data.forEach(c => {
                html += `
                    <div class="card" style="padding: 12px; margin-bottom: 10px;">
                        <strong>${escapeHtml(c.author)}</strong> <small class="text-muted">(${new Date(c.created_at).toLocaleDateString()} à ${new Date(c.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})</small>
                        <p style="margin-top: 6px; margin-bottom: 0;">${escapeHtml(c.content)}</p>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        async function postComment() {
            const authorInput = document.getElementById('comment-author');
            const contentInput = document.getElementById('comment-content');

            const author = authorInput.value.trim();
            const content = contentInput.value.trim();

            if (!author || !content) {
                alert("Veuillez remplir votre pseudo et votre commentaire !");
                return;
            }

            const { error } = await supabaseClient
                .from('comments')
                .insert([{
                    vote_id: voteId,
                    author: author,
                    content: content
                }]);

            if (error) {
                alert("Erreur : " + error.message);
            } else {
                contentInput.value = '';
                loadComments();
            }
        }

        // Sécurité basique anti-XSS pour l'affichage du texte utilisateur
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadVotePage();
    </script>
</body>
</html>
