<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VoteHi - Voter</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; }
        .banner { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; }
        .option-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .option-img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; margin-right: 15px; }
        .left { display: flex; align-items: center; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="vote-content">Chargement du vote...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://bsfdtdyoeaunssuqtgmj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gXblbgXH3n1ihrYa_OpB2A_r7nNSpCZ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Récupérer l'ID dans l'URL (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const voteId = urlParams.get('id');

        async function loadVotePage() {
            const container = document.getElementById('vote-content');

            if (!voteId) {
                container.innerHTML = "<h2>Erreur : Aucun identifiant de vote spécifié.</h2>";
                return;
            }

            const { data, error } = await supabaseClient
                .from('votes')
                .select('*')
                .eq('id', voteId)
                .single();

            if (error || !data) {
                container.innerHTML = "<h2>Impossible de trouver ce vote.</h2>";
                return;
            }

            // Vérifier dans le localStorage si l'utilisateur a déjà voté pour cet ID
            const hasVoted = localStorage.getItem(`voted_${voteId}`);

            let html = '';
            if (data.banner) {
                html += `<img src="${data.banner}" class="banner" alt="Bannière">`;
            }
            html += `<h1>${data.title}</h1>`;
            html += `<p>${data.description || ''}</p>`;
            html += `<h3>Options :</h3>`;

            data.options.forEach((opt, index) => {
                html += `
                    <div class="option-card">
                        <div class="left">
                            ${opt.image ? `<img src="${opt.image}" class="option-img">` : ''}
                            <div>
                                <strong>${opt.name}</strong><br>
                                <small>${opt.description || ''}</small><br>
                                <span>${opt.votes || 0} votes</span>
                            </div>
                        </div>
                `;

                if (!hasVoted) {
                    html += `<button onclick="castVote(${index})" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">Voter</button>`;
                } else {
                    html += `<span style="color: gray; font-style: italic;">Déjà voté</span>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
            window.currentVoteData = data; // Stocker pour la fonction de vote
        }

        async function castVote(optionIndex) {
            let data = window.currentVoteData;
            
            // Incrémenter l'option choisie
            data.options[optionIndex].votes = (data.options[optionIndex].votes || 0) + 1;

            // Mettre à jour Supabase
            const { error } = await supabaseClient
                .from('votes')
                .update({ options: data.options })
                .eq('id', voteId);

            if (error) {
                alert("Erreur lors de l'enregistrement du vote : " + error.message);
            } else {
                // Enregistrer dans le localStorage pour bloquer les futurs votes de cet appareil
                localStorage.setItem(`voted_${voteId}`, "true");
                alert("Votre vote a bien été pris en compte !");
                location.reload();
            }
        }

        loadVotePage();
    </script>
</body>
</html>
